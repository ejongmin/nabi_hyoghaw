# GDELT GKG는 영문 뉴스뿐 아니라 중문 뉴스도 포함.
# 아래 중문 alias를 company_aliases.yaml에 추가하면
# 데이터 부족 기업의 매칭 건수가 대폭 증가할 수 있음.
#
# 적용 방법:
#   1. 아래 내용을 company_aliases.yaml의 해당 기업 섹션에 병합
#   2. gdelt_bq.py 파이프라인 재실행 (or BigQuery에서 직접 쿼리)
#
# ⚠ 주의: GDELT GKG의 중문 기사 비중이 낮을 수 있으므로
