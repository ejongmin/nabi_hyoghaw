# gdelt_theme_mapping.yaml
# ========================================================
# GDELT GKG v2_themes → 9 risk_categories deterministic mapping
# ========================================================
# 설계 원칙:
#   1) GDELT의 공식 GKG Theme 분류체계에 기반 (재현 가능)
#   2) theme_prefix 매칭: v2_themes 문자열에서 테마코드 추출 후 prefix 매칭
#   3) weight: 해당 테마가 리스크 카테고리에 기여하는 강도 (1~5)
#   4) 다중 카테고리 가능: 하나의 테마가 여러 리스크에 해당할 수 있음
#   5) 학술 논문에 methodology로 명시 가능한 투명한 규칙
#
# severity 계산:
#   severity_raw = Σ(weight_i × hit_count_i) per category
#   severity = clip(log(1 + severity_raw) / log(1 + S_MAX), 0, 1)
#
# 참고: GDELT GKG Themes Codebook
#   https://blog.gdeltproject.org/gdelt-2-0-our-global-world-in-realtime/

# ────────────────────────────────────────
# A. GEOPOLITICS (지정학 리스크)
# ────────────────────────────────────────
geopolitics:
  themes:
    # 직접 무력충돌
    - prefix: "ARMEDCONFLICT"
      weight: 5
    - prefix: "MILITARY"
      weight: 5
    - prefix: "TAX_MILITARY"
      weight: 4
    - prefix: "WB_2462_POLITICAL_VIOLENCE_AND_WAR"
      weight: 5
    - prefix: "WB_2432_FRAGILITY_CONFLICT_AND_VIOLENCE"
      weight: 4
    - prefix: "REBELLION"
      weight: 5
    - prefix: "INSURGENCY"
      weight: 5
    - prefix: "COUP"
      weight: 5

    # 제재 / 수출통제
    - prefix: "SANCTIONS"
      weight: 4
    - prefix: "EMBARGO"
      weight: 4
    - prefix: "BLOCKADE"
      weight: 4

    # 테러
    - prefix: "TERROR"
      weight: 5
    - prefix: "TAX_TERROR"
      weight: 4

    # 정치불안 / 외교
    - prefix: "PROTEST"
      weight: 3
    - prefix: "CEASEFIRE"
      weight: 3
    - prefix: "MARTIAL_LAW"
      weight: 5
    - prefix: "POLITICAL_TURMOIL"
      weight: 4

    # 안보 / 정책
    - prefix: "EPU_CATS_NATIONAL_SECURITY"
      weight: 3
    - prefix: "SECURITY_SERVICES"
      weight: 2
    - prefix: "WB_2490_NATIONAL_PROTECTION_AND_SECURITY"
      weight: 3

    # 위기 일반 (지정학 연관)
    - prefix: "KILL"
      weight: 3
    - prefix: "WOUND"
      weight: 3
    - prefix: "CRISISLEX_T03_DEAD"
      weight: 3
    - prefix: "CRISISLEX_T02_INJURED"
      weight: 3

