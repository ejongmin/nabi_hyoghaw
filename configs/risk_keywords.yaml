      is_phrase: false
      route_node: null
      negatives: ["landslide victory", "landslide win"]

    - term: heatwave
      pattern: "heatwave|heat wave|extreme heat|高温|热浪|极端高温|폭염|열파"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    - term: extreme_weather
      pattern: "extreme weather|极端天气|恶劣天气|暴风雪|冰灾|寒潮|이상기후|극한기후|기상이변|한파|폭설"
