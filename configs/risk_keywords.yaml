# ────────────────────────────────────────────────
# E. MARKET  (시장 / 재무 / 수요 / 가격)
# ────────────────────────────────────────────────
market:
  notes: 시장·재무 리스크 — 파산, 수요감소, 가격폭락, 구조조정, EV둔화
