# ────────────────────────────────────────────────
# severity 계산 설정
# ────────────────────────────────────────────────
severity_config:
  formula: "clip( log(1 + severity_raw) / log(1 + S_max), 0, 1 )"
  S_max: 25
  headline_multiplier: 1.5
  volume_multiplier: 0.1
  finbert_weight: 0.2

# ────────────────────────────────────────────────
# 멀티라벨 처리 규칙
# ────────────────────────────────────────────────
multilabel_rules:
  priority_order: [geopolitics, logistics, natural, regulatory, market, labor, technology, esg, pandemic]
  allow_multilabel: true
  min_weight_threshold: 3
