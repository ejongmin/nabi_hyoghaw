    # ── 강도 5: 경로 차단 ──
    - term: blockade
      pattern: "blockade|封锁|海上封锁|봉쇄|해상봉쇄"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: strait_closure
      pattern: "strait closed|strait closure|strait blocked|航道封锁|항로차단|해협.*봉쇄"
      weight: 5
      is_phrase: true
      route_node: null
      negatives: []

    - term: shipping_halt
      pattern: "shipping halted|shipping suspended|shipping stopped|停航|停运|航运.*中断|선박.*중단"
      weight: 5
      is_phrase: true
      route_node: null
      negatives: []

    - term: vessel_attack
