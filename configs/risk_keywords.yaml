    # ── 강도 5: 생존 위협 ──
    - term: bankruptcy
      pattern: "bankrupt|insolvency|chapter 11|liquidation|wind.?down|破产|倒闭|清算|资不抵债|파산|부도|청산|법정관리|회생절차"
      weight: 5
      is_phrase: false
      route_node: null
