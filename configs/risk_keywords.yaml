  global_negatives:
    - "portfolio"
    - "report"


# ────────────────────────────────────────────────
# C. NATURAL  (자연재해 / 기후)
# ────────────────────────────────────────────────
natural:
  notes: 자연재해 리스크 — 지진, 태풍, 홍수, 가뭄, 극한기후
  context_filter:
    proximity_terms: [factory, plant, mine, port, facility, refinery, warehouse, production]
    proximity_window_tokens: 150
  keywords:

    # ── 강도 5 ──
    - term: earthquake
      pattern: "earthquake|seismic|地震|震灾|余震|지진|진도|여진"
