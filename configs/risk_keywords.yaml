# risk_keywords.yaml  (v5 — Unified Multilingual)
# ================================================
# 설계 원칙:
#   1) 1 term = 1 concept: 동일 개념은 EN|CN|KR 패턴을 하나의 term에 통합
#   2) weight는 개념의 severity에 따라 부여 (언어 무관)
#   3) 9개 risk_type × 언어 중립 → methodology 일관성 확보
#
# 스키마: risk_type / term / pattern / weight(1~5) / is_phrase / route_node / negatives
# severity_raw = Σ(weight_i × hit_count_i)   (per-term 기준, 벡터화 시 avg_weight)
# severity     = clip( log(1+severity_raw) / log(1+S_max), 0, 1 )

# ────────────────────────────────────────────────
# A. GEOPOLITICS  (전쟁 / 제재 / 수출통제 / 자원무기화)
# ────────────────────────────────────────────────
geopolitics:
  notes: 지정학 리스크 — 군사충돌, 제재, 수출통제, 무역전쟁, 자원무기화
  keywords:

    # ── 강도 5: 군사 충돌 / 직접 충격 ──
    - term: airstrike
      pattern: "airstrike|air strike|空袭|공습"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: missile_strike
      pattern: "missile strike|导弹.*袭击|미사일.*공격"
      weight: 5
      is_phrase: true
      route_node: null
      negatives: []

    - term: military_strike
      pattern: "military strike|军事打击|군사.*타격"
      weight: 5
      is_phrase: true
      route_node: null
      negatives: []

    - term: bombing
      pattern: "bombing|轰炸|폭격"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: ["carpet bombing"]

    - term: invasion
      pattern: "invasion|入侵|침공"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: armed_conflict
      pattern: "armed conflict|武装冲突|军事冲突|무력충돌|군사충돌"
      weight: 5
      is_phrase: true
      route_node: null
      negatives: []

    - term: war
      pattern: "war[^n]|trade.war|war.zone|civil.war|war.risk|战争|전쟁"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: ["trade war", "price war", "war of words", "cold war", "star wars", "贸易战", "무역전쟁"]

    - term: retaliation
      pattern: "retaliation|retaliatory|报复|反制|보복조치|맞대응"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: escalation
      pattern: "escalation|escalate|局势升级|冲突升级|紧张局势|긴장고조|갈등심화|대립격화"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: state_of_emergency
      pattern: "state of emergency|紧急状态|비상사태"
      weight: 5
      is_phrase: true
      route_node: null
      negatives: []

    # ── 강도 4: 제재 / 수출통제 ──
    - term: sanction
      pattern: "sanction[s]?|制裁|经济制裁|제재|경제제재"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    - term: embargo
      pattern: "embargo[es]?|禁运|금수조치"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    - term: export_control
      pattern: "export control[s]?|export ban|export restriction|出口管制|出口限制|수출규제|수출통제|수입금지"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    - term: entity_list
      pattern: "entity list|blacklist|blocked list|实体清单|黑名单|制裁名单|不可靠实体|블랙리스트|제재명단"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    - term: asset_freeze
      pattern: "asset freeze|asset seizure|资产冻结|资产扣押|자산동결"
      weight: 4
      is_phrase: true
      route_node: null
      negatives: []

    - term: martial_law
      pattern: "martial law|戒严|계엄"
      weight: 4
      is_phrase: true
      route_node: null
      negatives: []

    - term: resource_weaponization
      pattern: "resource weaponi[sz]ation|mineral weapon|critical mineral ban|资源武器化|稀土管制|자원무기화|핵심광물.*제한"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    - term: mineral_export_ban
      pattern: "lithium.*ban|cobalt.*ban|graphite.*restriction|graphite.*ban|锂.*禁|钴.*禁|石墨.*管制|리튬.*규제|희토류.*규제|광물.*수출.*금지"
      weight: 4
      is_phrase: false
      route_node: null
      negatives: []

    # ── 강도 3: 외교 / 무역 압력 ──
    - term: tariff
      pattern: "tariff[s]?|关税|加征关税|反倾销|반덤핑|관세|보복관세|상계관세"
      weight: 3
      is_phrase: false
      route_node: null
      negatives: ["tariff history", "tariff schedule"]

    - term: trade_war
      pattern: "trade war|贸易战|贸易摩擦|贸易冲突|무역전쟁|무역분쟁|통상분쟁"
      weight: 3
      is_phrase: true
      route_node: null
      negatives: []

    - term: diplomatic_crisis
      pattern: "diplomatic crisis|diplomatic tension|外交危机|외교.*위기|외교.*갈등"
      weight: 3
      is_phrase: true
      route_node: null
      negatives: []

    - term: ceasefire
      pattern: "ceasefire|cease-fire|停火|휴전"
      weight: 3
      is_phrase: false
      route_node: null
      negatives: []

    - term: national_security
      pattern: "national security|国家安全|国防安全|안보|국가안보"
      weight: 3
      is_phrase: true
      route_node: null
      negatives: ["national security adviser", "national security meeting"]

    - term: terror_attack
      pattern: "terror attack|terrorist attack|恐怖袭击|테러.*공격"
      weight: 3
      is_phrase: true
      route_node: null
      negatives: []

    - term: geopolitical_risk
      pattern: "geopolitical.*risk|地缘政治|중미갈등|미중갈등|지정학.*리스크|지정학적"
