      is_phrase: false
      route_node: null
      negatives: []

    - term: tsunami
      pattern: "tsunami|tidal wave|海啸|쓰나미|해일"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: typhoon
      pattern: "typhoon|台风|强台风|태풍"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    - term: hurricane
      pattern: "hurricane|飓风|허리케인"
      weight: 5
      is_phrase: false
      route_node: null
      negatives: []

    # ── 강도 4 ──
