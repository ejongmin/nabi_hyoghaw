# source_tiers.yaml
# ────────────────────
# Publisher → Tier 매핑.  title 접미사 " - Publisher" 형식에서 추출된 publisher 문자열을
# 정확 매칭(case-insensitive)으로 tier를 할당. 매칭 안되면 기본값 tier=3.
#
# 참조 방법론:
#   - Baker, Bloom, Davis (2016, QJE) "Measuring Economic Policy Uncertainty"
#       → 10개 주요 일간지만 사용하여 EPU 지수 구축. Tier 1 기준에 영향.
#   - Manela & Moreira (2017, JFE) "News implied volatility and disaster concerns"
#       → WSJ만 사용하는 단일 소스 접근
#   - Diebold-Yilmaz (2014, JoE) "On the network topology of variance decompositions"
#       → 네트워크 분석 시 source quality가 edge weight에 직접 영향
#
# Tier 분류 기준 (★ = 일부 판단 추론):
#   Tier 1 (weight 1.0): 편집 규범을 갖춘 주요 국가/국제 금융지, 관영 통신사, 본류 경제지
#   Tier 2 (weight 0.5): 산업 특화(자동차/배터리/광업/에너지), 틈새 금융, 지역 주요지, tech 전문지
#   Tier 3 (weight 0.15): 집계 사이트, 기업 공식 PR, 블로그, 프로모션·광고형 매체 (default)
#
# 중요: JA corpus의 92.6% positive bias는 tier 3인 株式会社モーターマガジン社, EVsmartブログ 등이
#        홍보성 신차 시승기를 대량 게재하기 때문. Tier 1만 남기면 bias 해소됨.

weights:
  1: 1.0
  2: 0.5
  3: 0.15

